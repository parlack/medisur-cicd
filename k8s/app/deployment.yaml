apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisur
  labels:
    app.kubernetes.io/name: medisur
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medisur
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medisur
        app.kubernetes.io/version: VERSION_PLACEHOLDER
      annotations:
        medisur.io/git-sha: GIT_SHA_PLACEHOLDER
        medisur.io/version: VERSION_PLACEHOLDER
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: medisur-app
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      # Keep all SQLite users on the existing node, even if the cluster grows.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: medisur.io/sqlite-node
                    operator: In
                    values: ['true']
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: ghcr.io/OWNER/medisur-cicd:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: medisur-config-v1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 7
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [python, -c, 'import time; time.sleep(5)']
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medisur-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi