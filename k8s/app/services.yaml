apiVersion: v1
kind: Service
metadata:
  name: medisur
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8000'
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: medisur
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: medisur-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: medisur
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081